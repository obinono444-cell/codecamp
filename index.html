<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCamp — Apprends à coder</title>
  <meta name="description" content="CodeCamp : cours interactifs en français pour apprendre à coder — JavaScript, HTML et CSS, avec éditeur intégré et correction automatique." />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-logo">&lt;/&gt;</span>
      <span class="brand-name">CodeCamp</span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="home">Accueil</a>
      <a href="#/plan" data-nav="plan">Mon plan</a>
      <a href="#/terminal" data-nav="terminal">⌨ Terminal</a>
      <button id="btn-hacker" class="btn-help" title="Mode hacker : pluie Matrix 🟩" aria-label="Mode hacker">&gt;_</button>
      <button id="btn-help" class="btn-help" title="Revoir la visite guidée" aria-label="Aide">?</button>
    </nav>
    <div class="topbar-right">
      <span class="streak">🔥 <span id="streak-days">0</span></span>
      <span class="xp">⭐ <span id="xp-total">0</span> XP</span>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <span>CodeCamp — apprendre à coder, une leçon à la fois.</span>
    <button id="admin-open" class="admin-open" title="Espace administrateur (Ctrl+Maj+A)">🔒 Admin</button>
  </footer>

  <iframe id="sandbox" class="sandbox-frame" sandbox="allow-scripts" title="sandbox"></iframe>

  <script src="js/lessons.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/matrix.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
